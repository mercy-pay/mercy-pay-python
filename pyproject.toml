[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mercy-pay"
dynamic = ["version"]
description = "La bibliothèque Python officielle de l'API Mercy Pay : paiements mobile money et carte."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]
keywords = ["mercy pay", "paiement", "mobile money", "webhooks", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://docs.mercy-pay.com"
Source = "https://github.com/mercy-pay/mercy-pay-python"
Issues = "https://github.com/mercy-pay/mercy-pay-python/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.version]
path = "src/mercypay/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mercypay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
